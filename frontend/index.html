<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Slate Enterprise Task Manager - High-performance code-split React workspace with real-time analytics, task management, and audit telemetry." />
    <title>Slate Task Manager | Enterprise Workspace</title>
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking asynchronous font loading -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    </noscript>
  </head>
  <body>
    <!-- Inline instant paint shell to drop FCP below 0.5s -->
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #f6fafe; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #171c1f;">
        <div style="text-align: center; padding: 24px;">
          <div style="width: 36px; height: 36px; margin: 0 auto 12px; border: 3px solid #dfe3e7; border-top-color: #1d2b3e; border-radius: 50%; animation: slate-spin 0.8s linear infinite;"></div>
          <div style="font-weight: 700; font-size: 16px; letter-spacing: -0.01em;">Slate Workspace</div>
          <div style="font-size: 12px; color: #75777d; margin-top: 4px;">Initializing optimized application shell...</div>
        </div>
      </div>
      <style>
        @keyframes slate-spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
